# Cargo workspace for the Learn Anything Rust crates.
# Sits alongside the pnpm workspace (packages/*) without interfering with it:
# the pnpm CLI/site build does not touch these members.
[workspace]
resolver = "2"
# Explicit members (not a `packages/*` glob) so Cargo doesn't try to parse the
# Node-only dirs like packages/cli. pnpm, in turn, ignores packages/learn-agent
# because it has no package.json.
members = [
    "packages/learn-agent",
    "packages/gui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# Shared agent crate, depended on by packages/gui/src-tauri (and the future
# server crate). Referenced via `learn-agent.workspace = true` in members.
learn-agent = { path = "packages/learn-agent" }
