# Cargo workspace for the Learn Anything Rust crates.
# Sits alongside the pnpm workspace (packages/*) without interfering with it:
# the pnpm CLI/site build does not touch these members.
[workspace]
resolver = "2"
# Explicit members (not a `packages/*` glob) so Cargo doesn't try to parse the
# Node-only dirs like packages/cli.
members = [
    "packages/gui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# Common utility crates shared by workspace members. Members add the specific
# features they need (`tokio` features, etc.) at the use site.
anyhow = "1"
tokio = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
