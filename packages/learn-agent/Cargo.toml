[package]
name = "learn-agent"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Shared learning-agent library for Learn Anything (workflows, ModelClient abstraction, v1 types, render)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rig-core = "0.39"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
futures = "0.3"
chrono = "0.4"
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
