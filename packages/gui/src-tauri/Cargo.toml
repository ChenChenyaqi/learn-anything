[package]
name = "learn-anything-gui"
version = "0.1.0"
description = "Learn Anything desktop application"
authors = ["yaqi chen"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't collide with the bin
# name on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "learn_anything_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native file/folder picker dialog for `pick_project_dir`.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error chaining for the backend command helpers.
anyhow.workspace = true
# OS keychain access (macOS Keychain / Windows Credential Manager / Linux
# secret-service) for the user's LLM API key. This is the "secure storage" seam
# required by the agent-keychain spec — the key is never written to plaintext.
# keyring v3 has NO default backend; we must enable the platform stores
# explicitly. `crypto-rust` gives the Linux secret-service backend a pure-Rust
# crypto impl (no system OpenSSL required) so it builds on Linux CI.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
# Needed for `tokio::sync::oneshot` in the `project` module's async dialog
# wrapper.
tokio = { workspace = true, features = ["sync", "process", "io-util", "time", "macros", "rt"] }
# Parses/validates the optional `base_url` in `set_config`.
url = "2"

[dev-dependencies]
# Sandboxed temp dirs for the `project` module filesystem tests.
tempfile = "3"
